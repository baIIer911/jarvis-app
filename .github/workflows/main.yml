name: Build Jarvis APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install Flet and Build APK
        run: |
          pip install "flet[all]>=0.27.6" httpx
          yes | flet build apk --yes --product "Jarvis" --org "com.baller911"
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: build/apk/**/*.apk
